[project]
name = "oki-agent"
version = "0.1.0"
description = "Local personal AI assistant demo with persona fine-tuning, memory, and safe tools."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch==2.8.0",
    "transformers>=5.12.1",
    "vllm>=0.11.0",
]

[project.scripts]
oki = "oki.cli:main"

[project.optional-dependencies]
training = [
    "accelerate>=0.34",
    "bitsandbytes>=0.43",
    "datasets>=2.20",
    "peft>=0.12",
]
dev = [
    "pytest>=8",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

