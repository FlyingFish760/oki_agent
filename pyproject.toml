[project]
name = "oki-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch==2.8.0",
    "transformers>=5.12.1",
    # 推理引擎层：默认走 Ollama
    "ollama>=0.4.0",
    # 记忆层：SQLite 走标准库；向量库用 Chroma
    "chromadb>=0.5.0",
    # 配置
    "pyyaml>=6.0",
    # CLI 体感
    "rich>=13.0",
]

[project.optional-dependencies]
# 微调流水线（Day2~Day4）。单独装：`uv sync --extra finetune`
finetune = [
    "peft>=0.13.0",
    "trl>=0.12.0",
    "datasets>=3.0.0",
    "bitsandbytes>=0.44.0",
    "accelerate>=1.0.0",
]

[project.scripts]
oki = "main:main"

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
